    answer: |
      A Term Deposit Account (TDA) fixes your money for a chosen term to
      earn a higher interest rate:
      - Term: 30-365 days
      - Minimum investment: ZMW 10,000
      - Interest: approximately 9.3%-16% per annum, depending on amount
