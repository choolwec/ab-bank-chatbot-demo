# E3 held-out evaluation set (moved from research/matcher-benchmark/heldout_v0.py).
#
# Customer phrasings NOT copied from the YAML phrases: written from each
# intent's label/topic, in the register real customers use (Zambian English,
# misspellings, run-on text). out_of_scope = questions the bot does NOT
# cover; many deliberately look like banking questions ("hard OOS"), since a
# confident wrong answer to one of those is the dangerous failure.
#
# NEVER copy these into an intent's phrases: -- that turns a held-out test
# into a training example and makes the E3 gates meaningless. Add new
# phrasings here, and new phrases to the YAML, separately.

