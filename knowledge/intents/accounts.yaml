      - "is my money safe in savings"
    answer: |
      A savings account helps you keep money safe and build towards a goal,
      with access when you need it. For current interest rates and charges I
      point you to the official tariff guide, so you always get up-to-date
      figures: {tariff_url}
      To open one, visit any branch — I can show you what to bring.
