id: c6-correct-phone-at-the-time-step
turns:
  - payload: human_handoff
  - say: Mary Banda
  - say: "0977123456"
  - say: a business loan
  - say: actually my number is 0966 123 456
    expect:
      flow_step: time
      flow_data_has: {phone: "0966123456", topic: business loan}
      text_contains: ["updated your phone to 0966 123 456", morning or afternoon]
  - payload: Morning
    expect: {text_contains: ["0966123456"]}
