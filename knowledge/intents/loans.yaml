      - "overdraft limit"
    answer: |
      SME overdraft requirements:
      - Valid business registration and operating licences
      - An active AB Bank account (or recent statements from another bank)
      - Amount is based on turnover — typically up to 30% of your average
        monthly turnover
      - Collateral: term deposit, landed property, or motor vehicle
      - Arrangement fee: 5%
    follow_ups:
