id: probe-02-over-informative-first-message
# The first message already says what happened, when and where. Don't ask
# for it again: confirm it instead.
fixes: C8
turns:
  - say: I lost my card yesterday at cairo branch
    expect:
      action: "urgent:fraud"
      active_flow: fraud
      flow_data_has: {what_happened: lost my card, when: yesterday}
      text_contains: [yesterday]
      text_lacks: [please tell me briefly what happened]
