# E3 evaluation gates, checked by tests/test_eval_gates.py on every build.
#
# RATCHET RULE: when a change improves a metric, the same commit tightens its
# gate to the new value. A gate is never loosened without a written reason in
# the commit message (and a line in the history below).
#
# History:
#   2026-09-23  baseline (E3), commit before any matcher change
#   2026-09-23  right_direct 0.538 -> 0.549: matcher ignores punctuation
#   2026-09-24  N2: oos_large_direct gate added at its baseline, 0.207
#   2026-09-24  N6 (out_of_scope intent): oos_direct 0.267 -> 0.100 and
#               oos_large_direct 0.207 -> 0.155, both tightened. right_direct
#               LOOSENED 0.549 -> 0.527, reason: the new phrases re-fit the
#               TF-IDF vocabulary and two borderline answers (0.704, 0.714)
#               slipped to 0.697/0.692. Both are still the top suggestion
#               (one_tap unchanged at 0.923); not re-tuned against the
#               held-out set on purpose. N3/N5 are expected to recover it.
gates:
  right_direct_min: 0.527
  wrong_direct_max: 0.044
  oos_direct_max: 0.100
  one_tap_min: 0.923
  # N2: the >= 300 out-of-scope set (tests/eval/oos.yaml)
