      AB Bank is a licensed local commercial bank operating in Zambia,
      regulated by the Bank of Zambia. We provide banking and credit
      solutions to individuals, SMEs, corporates, NGOs, churches, and
      associations through our branch network — current and savings
      accounts, personal and business loans, digital/mobile banking
      (eTumba), and local and international transfers.
    buttons:
