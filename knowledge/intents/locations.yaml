  - intent: opening_hours
    label: "Opening hours"
    category: locations
    status: draft
    phrases:
      - "what time do you open"
      - "opening hours"
      - "working hours"
      - "what time do you close"
      - "are you open on saturday"
      - "are you open on weekends"
      - "banking hours"
      - "business hours"
      - "opening times"
      - "are you open now"
      - "are you open on public holidays"
      - "working hours on saturday"
    answer: |
      Branches: Monday-Friday 08:00-15:00, Saturday 09:00-12:30. Closed
      Sundays and public holidays.
      Contact Centre: Monday-Friday 08:00-17:00, Saturday morning only
      [CONFIRM: our two source documents disagree on the exact Saturday
      start time — 09:00 vs 08:30 — so ask the team to confirm before we
      quote one].
      eTumba on {ussd_code} works 24 hours a day.
    answer_simple: >-
      Our branches are open Monday to Friday, 08:00 to 15:00, and on Saturday mornings. They are closed on Sundays and public holidays.
    buttons:
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Contact details", payload: "contact_details"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: contact_details
    label: "Contact details"
    category: locations
    status: draft
    phrases:
      - "phone number"
      - "contact details"
      - "how do i contact you"
      - "customer care number"
      - "call centre number"
      - "email address"
      - "whatsapp number"
      - "how can i reach you"
      - "contact number"
      - "your contacts"
      - "your phone number"
      - "contact centre number"
      - "what is your email"
      - "whatsapp contact"
      - "telephone number"
    answer: |
      You can reach AB Bank Zambia on:
      Contact Centre: {contact_phone}
      WhatsApp: {whatsapp_number}
      Email: {contact_email}
      Website: {website_url}
      You can also message us on Facebook, LinkedIn, or Instagram, or drop
      a written note in any branch's suggestion box.
      Or ask me for a callback and our team will phone you within one
      working day.
    # W9: someone already on WhatsApp shouldn't be told to "WhatsApp us".
    answer_by_channel:
      whatsapp: |
        You're already chatting with AB Bank on WhatsApp. You can also reach us on:
        Contact Centre: {contact_phone}
        Email: {contact_email}
        Website: {website_url}
        Or ask me for a callback and our team will phone you within one
        working day.
    buttons:
      - {label: "Request a callback", payload: "request_callback"}
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Opening hours", payload: "opening_hours"}
