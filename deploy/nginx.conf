# AB Bank Zambia chatbot: nginx site (ticket P7).
# Install: cp deploy/nginx.conf /etc/nginx/sites-available/abz-chatbot
#          ln -s ../sites-available/abz-chatbot /etc/nginx/sites-enabled/
#          nginx -t && systemctl reload nginx
# This file is included inside nginx's http {} block (Ubuntu's default
# nginx.conf does that for sites-enabled/*). Replace chatbot.example.zm with
# the real host name everywhere: [CONFIRM: production host name, IT].
#
# X-Forwarded-For: nginx APPENDS the address it sees, and the app takes the
# rightmost PROXY_HOPS entries as ours. With nginx alone in front, set
# PROXY_HOPS=1 in /etc/abz-chatbot/env. If the bank puts a load balancer or
# WAF in front of this VM as well, PROXY_HOPS=2 (one per proxy).

# Access log without query strings: the Meta verify handshake carries
# hub.verify_token in the URL, and nothing else there is worth keeping.
log_format abz_noquery '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                       '$status $body_bytes_sent $request_time "$http_user_agent"';

# The widget's script and stylesheet are loaded cross-origin by the bank's
# website, so they must not carry a same-origin resource policy.
map $uri $abz_corp {
    ~^/widget/  cross-origin;
    default     same-origin;
}

upstream abz_chatbot {
    server 127.0.0.1:8000;   # uvicorn, ONE worker (abz-chatbot.service)
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name chatbot.example.zm;

    # Let's Encrypt HTTP-01 challenges (certbot --webroot -w /var/www/letsencrypt).
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name chatbot.example.zm;
    server_tokens off;

    # Either the bank's own certificate (full chain) or Let's Encrypt's:
    #   ssl_certificate     /etc/letsencrypt/live/chatbot.example.zm/fullchain.pem;
    #   ssl_certificate_key /etc/letsencrypt/live/chatbot.example.zm/privkey.pem;
    ssl_certificate     /etc/ssl/abz-chatbot/fullchain.pem;
    ssl_certificate_key /etc/ssl/abz-chatbot/privkey.pem;

    # Mozilla "intermediate" profile: TLS 1.2 and 1.3 only.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ABZ_TLS:10m;
    ssl_session_tickets off;

    access_log /var/log/nginx/abz-chatbot.access.log abz_noquery;
    error_log  /var/log/nginx/abz-chatbot.error.log warn;

    # A chat message is capped at 4000 characters; 64 KB is ample.
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Security headers. They apply to this host's own pages (demo, admin).
    # The widget runs inside the bank's page, not in a frame, so refusing
    # to be framed doesn't affect it. CORS is the app's job (ALLOWED_ORIGINS):
    # nginx must not add or strip Access-Control-* headers.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Cross-Origin-Resource-Policy $abz_corp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 30s;

    location / {
        proxy_pass http://abz_chatbot;
    }

    # WhatsApp and Messenger webhooks. The app checks X-Hub-Signature-256
    # over the RAW body, so it must arrive byte for byte: no gzip/gunzip of
    # requests, no body rewriting, no WAF body normalisation on this path.
    # Request buffering stays on: it copies the body unchanged and stops a
    # slow client from holding the single worker. Meta batches events, so
    # the limit is higher here. [VERIFY: Meta's maximum webhook payload size]
    location /webhooks/ {
        client_max_body_size 3m;
        proxy_request_buffering on;
        proxy_pass http://abz_chatbot;
    }

    # External uptime checks poll this every minute; keep them out of the log.
    location = /health {
        access_log off;
        proxy_pass http://abz_chatbot;
    }

    # Staff pages show names, numbers and transcripts. Besides the app's
    # Basic auth (ADMIN_USER/ADMIN_PASSWORD), only the bank's network may
    # reach them. [CONFIRM: the staff network ranges, IT] Until then, use an
    # SSH tunnel: ssh -L 8443:127.0.0.1:443 <vm>, then https://localhost:8443.
    location /admin/ {
        # allow 10.0.0.0/8;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://abz_chatbot;
    }
}
