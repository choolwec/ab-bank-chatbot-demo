  - intent: micro_loan
    label: "Micro Loan"
    lead_topic: "Micro Loan"
    category: loans
    status: draft
    wording: flow_doc
    phrases:
      - "micro loan"
      - "microloan"
      - "loan for market traders"
      - "small loan for my shop"
      - "loan for my stall"
    answer_short: "Need financing to support your small business?\nOur Micro Loan is designed for small businesses, market traders, and shop owners looking to grow, manage cash flow, or invest in business opportunities.\nWith flexible repayment terms and financing tailored to your business needs, a Micro Loan can help you take your next step with confidence.\nReady to take your business to the next level?"
    answer: |
      Micro Loan, for small businesses, market traders and shop owners:
      - Amount: K1,000 to K350,000
      - Repayment: 4 to 24 months
      - Interest: 3%-8% per month, depending on the amount and term
        [CONFIRM: the rate to quote for Micro loans]
      You need:
      - A business running for at least 12 months in Lusaka, Kitwe, Ndola,
        Mumbwa, Solwezi or Chipata
      - To be aged 21-65, Zambian, or a foreign national with a business, work
        or investor's permit
      - Original ID (NRC, passport or driving licence) and proof of residence
        (a utility bill)
      - A guarantor in business or formal employment
      - Collateral (household goods, fixed assets or a mortgage)
      - If you are married, your spouse takes part in the process
      Processing takes about 7 working days once your documents are complete.
      Approval always depends on assessment, and you get the full terms and cost
      in writing before you sign.
    on_yes: lead:micro_loan
    on_no: business_loan_options
    buttons:
      - {label: "Yes, contact me", payload: "lead:micro_loan"}
      - {label: "Back", payload: "business_loan_options"}

