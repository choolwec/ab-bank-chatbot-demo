# AB Bank Zambia chatbot: log rotation (ticket P7).
# Install: install -m 644 deploy/logrotate.conf /etc/logrotate.d/abz-chatbot
# Check:   logrotate -d /etc/logrotate.d/abz-chatbot
#
# Not here: nginx's logs, including abz-chatbot.*.log, are rotated by
# Ubuntu's own /etc/logrotate.d/nginx (14 days); the app itself logs to the
# journal (limit it in /etc/systemd/journald.conf, runbook-production.md).

# The append-only audit copy and the mock-mode outboxes (the Jira mock holds
# names and numbers). The app opens these files for every write, so renaming
# them is safe. 90 daily files matches TRANSCRIPT_RETENTION_DAYS; keep the two
# in step. [CONFIRM: retention period, Legal]
/var/lib/abz-chatbot/data/*.jsonl {
    su abz abz
    daily
    rotate 90
    maxage 90
    dateext
    compress
    delaycompress
    missingok
    notifempty
    create 0600 abz abz
}

# deploy.sh, test, backup and alert logs.
/var/log/abz-chatbot/*.log {
    weekly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    create 0640 root adm
}
