    answer_short: "What type of account are you interested in?"
    answer: |
      We offer these main account types:
      - Tamanga — everyday current account (ZMW 36/month)
      - Tamanga Plus — premium current account with Online Banking (ZMW 135/month)
      - Mukula Plus — corporate/business current account (ZMW 200/month)
      - Savings account — 5% interest per annum
      - Savings Plan account — locked for withdrawals, up to 7% interest
      - Kids Savings account — for under-16s, 7% interest
      - Term Deposit Account — fix funds 30-365 days, 9.3%-16% interest
      - Joint account (AND or OR)
      Which one would you like to know more about?
    answer_simple: >-
      We have everyday accounts (Tamanga and Tamanga Plus), a business account (Mukula Plus), and savings accounts for adults and for children. Tell me which one you'd like to know about.
