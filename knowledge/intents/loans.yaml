intents:
  - intent: msme_loan
    label: "Business (MSME) loans"
    category: loans
    status: draft
    phrases:
      - "business loan"
      - "busines loan"
      - "loan for my business"
      - "msme loan"
      - "sme loan"
      - "i need money for my shop"
      - "working capital loan"
      - "loan for stock"
      - "borrow money for business"
      - "do you give business loans"
      - "capital for my business"
    answer: |
      We lend to Zambian micro, small and medium businesses — for stock,
      equipment and working capital. Loan size and terms depend on your
      business, and a loan officer assesses each application personally,
      usually with a visit to your business. I don't quote rates in chat —
      your loan officer gives you the full cost in writing before you sign.
      [CONFIRM: product range and amounts.]
    buttons:
      - {label: "Loan requirements", payload: "loan_requirements"}
      - {label: "How to apply", payload: "loan_apply_how"}
      - {label: "Agriculture loans", payload: "agri_loan"}
      - {label: "Talk to a person", payload: "human_handoff"}

