intents:
  - intent: etumba_what_is
    label: "What is eTumba?"
    category: etumba
    status: draft
    phrases:
      - "what is etumba"
      - "wat is etumba"
      - "tell me about etumba"
      - "e tumba"
      - "etumba wallet"
      - "mobile wallet"
      - "etumba account"
      - "do you have mobile money"
      - "what is e-tumba"
      - "explain etumba"
      - "etumba meaning"
    answer: |
      eTumba is AB Bank Zambia's mobile wallet. It lets you send and receive
      money, buy airtime and pay for services straight from your phone — no
      smartphone or internet needed, just dial {ussd_code}.
      You can put money in or take it out at our branches and at Kazang,
      543 Konse Konse and Zoona agents countrywide.
    buttons:
      - {label: "Register for eTumba", payload: "etumba_register"}
      - {label: "eTumba fees", payload: "etumba_fees"}
      - {label: "Find an agent", payload: "agent_locator"}
      - {label: "Talk to a person", payload: "human_handoff"}

