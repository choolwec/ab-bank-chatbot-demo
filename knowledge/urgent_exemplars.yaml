# N7: exemplar fraud / lost-card reports for the model-based urgent check.
# A message whose embedding is close enough to one of these (config.EMB_URGENT,
# calibrated by `python -m admin.calibrate_urgent`) gets the soft-urgent
# confirmation question even if the keyword rules missed it. It can only ever
# ASK; it never suppresses a rule-based signal. Our own wording (from the S1
# corpus), never evaluation-set text. Add real reports the rules missed.

exemplars:
- someone stole money from my etumba
- they stole my money
- someone took money from my account
- my money was taken without my permission
- my money has been stolen
- somebody is stealing from my account
- someone steals money from my wallet every week
