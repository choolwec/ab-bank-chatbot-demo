      - "government employee loan"
      - "payslip loan"
      - "loan against my salary"
      - "personal loans"
      - "personal loan without collateral"
    answer: |
      Personal loans are available to government employees only:
      - Amount: ZMW 1,000 - ZMW 500,000
      - Interest: up to 3.75% per month
      - Tenure: 4-60 months
      - No collateral needed, processed within 24 hours of full documents
      Documents: signed pre-approval form (from
      www.abbank.co.zm/personal-loan), valid ID, an introductory letter
      from your employer, 2 latest pay slips, and 2 months' bank
      statements.
    buttons:
      - {label: "How to apply", payload: "loan_apply_how"}
