intents:
  - intent: etumba_what_is
    label: "What is eTumba?"
    category: etumba
    status: draft
    phrases:
      - "what is etumba"
      - "wat is etumba"
      - "tell me about etumba"
      - "e tumba"
      - "etumba wallet"
      - "mobile wallet"
      - "etumba account"
      - "do you have mobile money"
      - "what is e-tumba"
      - "explain etumba"
      - "etumba meaning"
      - "what is etumba all about"
      - "is etumba mobile money"
      - "ab bank mobile money"
      - "what can i do with etumba"
      - "tell me about the etumba wallet"
    answer: |
      eTumba is AB Bank Zambia's mobile wallet. It lets you send and
      receive money, buy airtime on MTN, Airtel and Zamtel, pay ZESCO and
      water bills, and save via Yaka — straight from your phone, no
      smartphone or internet needed, just dial {ussd_code}.
      Cash in/out at any AB Bank branch, or at Kazang, 543 Konse Konse and
      Zoona agents countrywide.
    answer_simple: >-
      eTumba is a wallet on your phone. You can send money, buy airtime and pay bills with it. You don't need a smartphone or the internet — just dial {ussd_code}.
    follow_ups:
      fees_charges: etumba_fees
      account_opening_requirements: etumba_register
      loan_requirements: etumba_register
      business_account_requirements: etumba_register
      account_opening_how: etumba_register
    buttons:
      - {label: "Register for eTumba", payload: "etumba_register"}
      - {label: "eTumba fees", payload: "etumba_fees"}
      - {label: "Find an agent", payload: "agent_locator"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: etumba_register
    label: "Register for eTumba"
    category: etumba
    status: draft
    phrases:
      - "how do i register for etumba"
      - "sign up for etumba"
      - "get etumba"
      - "join etumba"
      - "activate etumba"
      - "etumba registration"
      - "register etumba"
      - "how to get etumba wallet"
      - "open etumba account"
      - "etumba sign up"
      - "how to register etumba"
      - "register on etumba"
      - "create etumba account"
      - "download etumba app"
      - "can i register etumba without a bank account"
    answer: |
      Two ways to register: download the eTumba app from the Google Play
      Store or App Store, or dial {ussd_code} and follow the prompts.
      Registering doesn't automatically link eTumba to your AB Bank
      account — for that, visit any branch with your original ID
      (NRC/Passport/Driving Licence) to link the two.
    answer_simple: >-
      You can join eTumba in two ways: get the eTumba app, or dial {ussd_code}. To connect it to your AB Bank account, take your ID to any branch.
    buttons:
      - {label: "What is eTumba?", payload: "etumba_what_is"}
      - {label: "eTumba fees", payload: "etumba_fees"}
      - {label: "Find an agent", payload: "agent_locator"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: etumba_ussd
    label: "Using *888#"
    category: etumba
    status: draft
    phrases:
      - "how do i use *888#"
      - "*888#"
      - "888"
      - "dial 888"
      - "what is the ussd code"
      - "etumba code"
      - "ussd menu"
      - "etumba menu"
      - "how to check etumba balance"
      - "send money on etumba"
      - "ussd code for etumba"
      - "star 888"
      - "etumba shortcode"
      - "how to use etumba without internet"
    answer: |
      Dial {ussd_code} on your phone to open the eTumba menu. From there
      you can register, check your balance, send money, buy airtime, pay
      ZESCO/water, and save via Yaka — it all happens securely on your
      phone, so I never see your balance or PIN.
    answer_simple: >-
      Dial {ussd_code} on your phone. A menu opens. Choose what you want to do, like checking your balance or sending money.
    follow_ups:
      fees_charges: etumba_fees
      account_opening_requirements: etumba_register
      loan_requirements: etumba_register
      business_account_requirements: etumba_register
      account_opening_how: etumba_register
    buttons:
      - {label: "Register for eTumba", payload: "etumba_register"}
      - {label: "Transfers to mobile money", short_label: "Send to mobile money", payload: "etumba_transfer_mobile_money"}
      - {label: "Cash in / cash out", payload: "etumba_cash_in_out"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: etumba_fees
    label: "eTumba fees"
    category: etumba
    status: draft
    phrases:
      - "etumba charges"
      - "etumba fees"
      - "how much does etumba cost"
      - "is etumba free"
      - "cost of sending money on etumba"
      - "etumba withdrawal charges"
      - "charges for etumba"
      - "etumba tariffs"
      - "what does etumba charge"
      - "etumba transaction fees"
      - "etumba transfer charges"
      - "how much to send money on etumba"
      - "etumba levy"
      - "mobile money levy"
      - "etumba cost"
      - "etumba withdrawal fee"
    answer: |
      A mobile levy applies to wallet-to-wallet transfers and
      wallet-to-other-AB-Bank-account transfers — this is Zambia's
      statutory Mobile Money Transaction Levy (a government charge, not an
      AB Bank fee). All other eTumba charges are listed in the tariff
      guide: {tariff_url}
    answer_simple: >-
      When you send money from eTumba, the government charges a small levy. It is not an AB Bank fee. Our other charges are in the tariff guide: {tariff_url}
    buttons:
      - {label: "What is eTumba?", payload: "etumba_what_is"}
      - {label: "Register for eTumba", payload: "etumba_register"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: etumba_cash_in_out
    label: "eTumba cash in / cash out"
    short_label: "eTumba cash in/out"
    category: etumba
    status: draft
    phrases:
      - "deposit into etumba"
      - "withdraw from etumba"
      - "cash in etumba"
      - "cash out etumba"
      - "top up my etumba"
      - "put money on etumba"
      - "withdraw etumba at atm"
      - "cardless withdrawal"
      - "deposit cash at kazang"
      - "withdraw cash at agent"
      - "how do i deposit money on etumba"
      - "how to withdraw from etumba"
      - "load money on etumba"
      - "atm withdrawal without a card"
      - "withdraw etumba money at the bank"
    answer: |
      Deposit or withdraw at any AB Bank branch, at Kazang / 543 Konse
      Konse / Zoona agents, or (withdraw only) cardless at supporting
      ATMs. Note: AB Bank doesn't operate its own branded ATMs — cardless
      withdrawal works via the mobile-network-operator (MNO) option at
      participating ATMs.
      At an agent: dial {ussd_code} → option 3 (transact with agent/ATM),
      then follow the deposit or withdraw prompts.
    buttons:
      - {label: "Find an agent", payload: "agent_locator"}
      - {label: "Pull / push funds", payload: "etumba_pull_push_funds"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: etumba_pull_push_funds
    label: "Move money between eTumba and my bank account"
    short_label: "eTumba to bank"
    category: etumba
    status: draft
    phrases:
      - "move money from my bank account to etumba"
      - "pull money to etumba"
      - "push money to my bank account"
      - "transfer from bank account to etumba"
      - "transfer from etumba to my bank account"
      - "link etumba to bank account"
      - "get money into etumba from my account"
      - "send etumba balance to my account"
      - "pull funds"
      - "push funds"
      - "move money from etumba to bank"
      - "transfer money from my account to etumba"
      - "send money from bank to wallet"
      - "pull from ab bank account"
      - "move funds from etumba to my tamanga account"
    answer: |
      Pull funds (bank → eTumba): dial {ussd_code} → option 2 (Get money)
      → option 1 (Pull from AB Bank account) → enter amount → confirm →
      PIN.
      Push funds (eTumba → bank): dial {ussd_code} → option 1 → option 2 →
      enter account number → amount → PIN.
      You'll need to link eTumba to your AB Bank account at a branch first
      if you haven't already.
    follow_ups:
      fees_charges: etumba_fees
    buttons:
      - {label: "Register for eTumba", payload: "etumba_register"}
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: etumba_transfer_mobile_money
    label: "Transfer between eTumba and Airtel/MTN/Zamtel"
    short_label: "Send to mobile money"
    category: etumba
    status: draft
    phrases:
      - "transfer to airtel money"
      - "transfer to mtn momo"
      - "send money to airtel from etumba"
      - "send money to mtn from etumba"
      - "zamtel to etumba"
      - "airtel to etumba"
      - "mtn to etumba"
      - "how do i send etumba to mobile money"
      - "receive money from airtel money"
      - "transfer between etumba and mobile money"
      - "send money to airtel money"
      - "etumba to mtn"
      - "etumba to airtel"
      - "send to zamtel money"
      - "receive money from mtn into etumba"
      - "mobile money to etumba"
    answer: |
      eTumba → Airtel Money: dial {ussd_code} → 1 (Send money) → 3 (send
      to mobile money) → 2 (Airtel Money) → enter number, amount, and a
      reference → PIN.
      eTumba → MTN Momo: dial {ussd_code} → 1 → 3 → 1 (MTN) → enter
      number, amount, and reference → PIN.
      Airtel/MTN/Zamtel → eTumba: use each operator's own USSD (e.g. Airtel
      *115#, select Send Money → Banks → AB Bank) and enter your eTumba
      number.
    follow_ups:
      fees_charges: etumba_fees
    buttons:
      - {label: "Pull / push funds (bank account)", short_label: "eTumba to bank", payload: "etumba_pull_push_funds"}
      - {label: "eTumba fees", payload: "etumba_fees"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: yaka_savings
    label: "Yaka savings"
    category: etumba
    status: draft
    phrases:
      - "yaka"
      - "yaka savings"
      - "what is yaka"
      - "etumba savings"
      - "save money on etumba"
      - "how do i open yaka"
      - "yaka interest rate"
      - "yaka savings account"
      - "save with etumba"
      - "yaka pa tumba"
      - "yaka account"
      - "how does yaka work"
      - "open yaka"
      - "yaka interest"
      - "savings on etumba"
    answer: |
      Yaka is a savings pocket inside eTumba — move funds between your
      eTumba main balance and Yaka Savings, earning 5% interest per annum,
      credited monthly.
      To open: dial {ussd_code} → option 6 → option 1 → enter your PIN →
      select Yaka Savings.
    buttons:
      - {label: "What is eTumba?", payload: "etumba_what_is"}
      - {label: "Savings account (bank)", short_label: "Savings account", payload: "savings_account"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: zesco_token
    label: "Retrieving a ZESCO token"
    short_label: "ZESCO token"
    category: etumba
    status: draft
    phrases:
      - "zesco token"
      - "how do i get my zesco token"
      - "retrieve zesco token"
      - "prepaid electricity token"
      - "i cant find my zesco token"
      - "zesco payment token"
      - "where is my electricity token"
      - "lost my zesco token"
      - "view my zesco transaction"
      - "zesco token etumba"
      - "zesco units token"
      - "i paid zesco but no token"
      - "token not received"
      - "i bought units but did not get the token"
      - "resend zesco token"
    answer: |
      Via USSD: dial {ussd_code} → select 8 → View Accounts/Transactions
      (1) → View eTumba transactions (2) → Outgoing Transactions → enter
      PIN → select the ZESCO payment to see the token.
      Via the app: "View Accounts & Transactions" → "View eTumba
      transactions" → tap the ZESCO payment for the token.
    buttons:
      - {label: "What is eTumba?", payload: "etumba_what_is"}
      - {label: "Talk to a person", payload: "human_handoff"}

  - intent: etumba_reversal
    label: "Reverse a wrongly sent eTumba transfer"
    short_label: "Reverse a transfer"
    category: etumba
    status: draft
    phrases:
      - "reverse etumba transaction"
      - "sent money to wrong number"
      - "cancel etumba transfer"
      - "wrong number etumba"
      - "i sent money to the wrong person"
      - "undo etumba payment"
      - "etumba send money mistake"
      - "cancel pending etumba transaction"
      - "reversal of etumba payment"
      - "recall etumba money"
      - "i sent money to a wrong number"
      - "wrong transfer on etumba"
      - "how do i reverse money sent by mistake"
      - "i made a mistake sending money"
      - "money sent to the wrong number"
    answer: |
      If the money was sent to a number that isn't registered on eTumba:
      dial {ussd_code} → 1 (send money) → 5 (view pending) → select 3,
      then the number the money was sent to → option 1 to cancel → PIN to
      authorize.
      If the recipient's number IS on eTumba and already received the
      funds, this USSD reversal won't work — contact the Contact Centre
      to raise it as a case.
    buttons:
      - {label: "Talk to a person", payload: "human_handoff"}
      - {label: "Contact details", payload: "contact_details"}

