      - "loan for fertiliser"
      - "farmers loan"
      - "agro loan"
      - "loan for seeds"
      - "do you have loans for farmers"
      - "livestock loan"
    answer: |
      Our agri loans support farmers — for inputs like seed and fertiliser,
      for equipment, and for growing your farm business. Repayment is
      designed around farming seasons where possible. [CONFIRM: product
      details and repayment structures.] A loan officer will assess your farm
      and explain the full cost before you sign anything.
    buttons:
      - {label: "Loan requirements", payload: "loan_requirements"}
      - {label: "How to apply", payload: "loan_apply_how"}
