      - "documents for opening a business account"
      - "what documents does a company need to open an account"
      - "pacra documents for account opening"
      - "what do i need to open a business account"
      - "requirements for mukula plus"
      - "business account documents"
      - "board resolution for opening an account"
      - "what does a sole trader need to open an account"
    answer_short: "You need original registration and tax documents, plus ID for the owner or each signatory. The exact list depends on whether you're a company, sole trader or club/NGO."
    answer: |
      Requirements vary by entity type:
      - Limited company: certificate of share capital, certificate of
        incorporation, TPIN certificate, Form 3, articles of association,
        a PACRA print-out (stamped, under 30 days old), board resolution,
        and proof of address/ID for the company and each signatory.
      - Sole trader: certificate of registration, ZRA tax registration
        certificate, PACRA form 3, a PACRA print-out (stamped, under 30
        days old), reference form, and the owner's ID.
      - Clubs/churches/NGOs/associations: tax exemption certificate,
        articles of association/constitution, board resolution, and proof
        of address/ID for the organization and each signatory.
      All documents must be original. A branch can confirm the exact list
      for your specific case.
    buttons:
      - {label: "Business account overview", short_label: "Business account", payload: "business_account"}
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Talk to a person", payload: "human_handoff"}

