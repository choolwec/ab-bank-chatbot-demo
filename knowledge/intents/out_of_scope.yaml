# N6: an explicit "that's not something I can help with" intent.
#
# Phrases describe OTHER organisations' services and non-banking topics --
# the hard lookalikes that a string matcher otherwise answers with the wrong
# banking topic ("where is the zra branch" -> our branch finder). They were
# written from categories, NOT copied from tests/eval/*.yaml (a test enforces
# that), so the E3 gates stay a fair measure. Grow this from real traffic.
# Short topical sentences ("changing the password on my social media app")
# suit the embedding matcher; bare platform names ("facebook account") hold
# off the character matcher's word overlap with our account intents.
#
# The E3 gates count a match here as a CORRECT abstention.

intents:
  - intent: out_of_scope
    label: "Something else"
    category: out_of_scope
    status: draft
    phrases:
      - "passport office application"
      - "renew national registration card at the registration office"
      - "rtsa driving licence and road tax"
      - "zra tax return and tpin"
      - "pacra company registration"
      - "police station report"
      - "i need legal advice about my landlord"
      - "hospital or clinic appointment"
      - "ecz exam results"
      - "unza admission and university fees"
      - "job vacancies and recruitment"
      - "airtel data bundles"
      - "mtn sim card registration"
      - "zamtel line problem"
      - "zesco power outage in my area"
      - "lusaka water and sewerage bill"
      - "dstv or gotv subscription"
      - "my facebook or instagram account problem"
      - "gmail or email password"
      - "wifi router and internet at home"
      - "laptop or phone repair"
      - "supermarket or mall opening times"
      - "bus or flight tickets"
      - "weather forecast"
      - "football scores and fixtures"
