# ============================================================================
# Intent schema (all files in this directory):
#   intent:    unique id (used as button payload)
#   label:     human-readable name, shown on "Did you mean...?" buttons
#   category:  topic slot stored in session context
#   status:    draft | legal_review | approved   <- ALL DRAFT until legal signs off
#   flow:      (optional) start this state machine instead of a static answer
#   flow_args: (optional) parameters for the flow
#   phrases:   curated free-text triggers — include misspellings and Zambian
#              English; the regression suite asserts every phrase matches
#   answer:    approved text; {placeholders} filled from app/config.py CONTACTS
#   buttons:   every answer must offer at least one next step (no dead ends)
#   answer_simple: (optional) a plainer, shorter version of the answer, sent
#              when the customer asks "what do you mean?" -- same facts only
#   follow_ups: (optional) {generic intent: specific intent} -- after this
#              answer, a short follow-up ("how much does it cost?") that
#              matches the generic intent gets the specific one (C9)
#   answer_by_channel: (optional) {whatsapp|messenger|web: text} -- a channel
#              variant of the answer, same facts (W9)
#   lead_topic: (optional) a product: viewing it is recorded as an interest,
#              and "Yes, contact me" (payload lead:<intent>) starts the
#              callback form with this as the ticket's topic
#   match:     (optional) "exact" -- small talk that answers only when the
#              WHOLE message is one of its phrases; kept out of the scored
#              matcher so it never captures a real question
#   answer_short: (optional) the short answer shown first, with a "More
#              details" button for the full `answer`. Same facts as the
#              answer, never new ones; no [CONFIRM placeholders
#   on_yes / on_no: (optional) the payload a typed "yes" / "no" means, when
#              the answer ends in a yes/no question ("anything else?")
#
# Content edits are deploys (§6): run pytest before committing. Git history
# is the content audit trail.
# ============================================================================

