intents:
  - intent: account_types_overview
    label: "Types of accounts"
    category: accounts
    status: draft
    phrases:
      - "what types of accounts do you have"
      - "which accounts do you offer"
      - "tell me about your accounts"
      - "accounts available"
      - "types of acounts"
      - "kinds of accounts"
      - "what account can i open"
      - "do you have personal accounts"
      - "compare your accounts"
      - "account options"
      - "banking accounts you offer"
    answer: |
      We offer these main account types:
      - Tamanga — everyday current account (ZMW 36/month)
      - Tamanga Plus — premium current account with Online Banking (ZMW 135/month)
      - Mukula Plus — corporate/business current account (ZMW 200/month)
      - Savings account — 5% interest per annum
      - Savings Plan account — locked for withdrawals, up to 7% interest
      - Kids Savings account — for under-16s, 7% interest
      - Term Deposit Account — fix funds 30-365 days, 9.3%-16% interest
      - Joint account (AND or OR)
      Which one would you like to know more about?
    answer_simple: >-
      We have everyday accounts (Tamanga and Tamanga Plus), a business account (Mukula Plus), and savings accounts for adults and for children. Tell me which one you'd like to know about.
    buttons:
      - {label: "Savings account", payload: "savings_account"}
      - {label: "Current account (Tamanga)", payload: "current_account"}
      - {label: "Business account", payload: "business_account"}
      - {label: "How to open an account", payload: "account_opening_how"}

  - intent: savings_account
    label: "Savings account"
    category: accounts
    status: draft
    phrases:
      - "savings account"
      - "tell me about savings"
      - "savngs account"
      - "savings acount"
      - "i want to save money"
      - "saving account details"
      - "interest on savings"
      - "how does the savings account work"
      - "open a savings account"
      - "is my money safe in savings"
    answer: |
      Our Savings account lets you deposit and withdraw at any time:
      - Minimum balance: ZMW 100
      - Interest: 5% per annum, credited monthly
      - No opening fees, no monthly/maintenance fees
      To open one, visit any branch with your NRC/passport, proof of
      residence, and TPIN certificate — I can show you the full list.
    answer_simple: >-
      A Savings account keeps your money safe and pays you 5% interest a year. You need at least ZMW 100 in it. There is no monthly fee.
    buttons:
      - {label: "What you need to open", payload: "account_opening_requirements"}
      - {label: "Savings Plan account", payload: "savings_plan_account"}
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Fees & charges", payload: "fees_charges"}

