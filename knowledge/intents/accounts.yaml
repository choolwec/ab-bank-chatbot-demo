  - intent: business_account_requirements
    label: "Business account documents by entity type"
    short_label: "Business documents"
    category: accounts
    status: draft
    phrases:
      - "documents to open a company account"
      - "requirements for business account"
      - "pacra requirements"
      - "ngo account requirements"
      - "church account requirements"
      - "documents for limited company account"
      - "sole trader account requirements"
      - "what does my club need to open an account"
