intents:
  - intent: msme_loan
    label: "Business (MSME) loans"
    lead_topic: "Business loan"
    short_label: "Business loans"
    category: loans
    status: draft
    phrases:
      - "business loan"
      - "busines loan"
      - "msme loan"
      - "sme loan"
      - "i need money for my shop"
      - "working capital loan"
      - "loan for stock"
      - "borrow money for business"
      - "do you give business loans"
      - "capital for my business"
      - "loan for my small business"
      - "sme loans"
      - "micro loan for business"
      - "loan to grow my business"
      - "business loan interest rate"
      - "how much can i borrow for my business"
      - "loan to buy stock for my shop"
      - "small business loan"
    exact_phrases:
      - "loan interest rate"
      - "interest rate on loans"
      - "loan interest"
      - "what is the interest on a business loan"
    answer_short: "Business loans run from K1,000 to K5,000,000, repaid over 4 to 60 months. You need a business running 12+ months, a guarantor and collateral, in a town we serve."
    answer: |
      Business loans for micro, small and medium-sized businesses:
      - Micro Loan: K1,000 to K350,000, repaid over 4 to 24 months
      - SME Loan: K200,000 to K5,000,000, repaid over 4 to 60 months
      - Trader Mobility Loan: for motorbikes, tricycles, three-wheelers and
        walking tractors
      Interest: 3%-8% per month, depending on the amount and term.
      Your business must have been running for at least 12 months, within our
      network (Lusaka, Kitwe, Ndola, Mumbwa, Solwezi or Chipata), with
      collateral and a guarantor. Processing takes about 7 working days once
      documents are complete. Approval always depends on assessment, so I
      can't promise an amount or timeline before your documents are in.
    answer_simple: >-
      We lend to businesses that are at least 12 months old. You need something valuable as security (collateral), and a person who agrees to repay if you can't (a guarantor).
    follow_ups:
      account_opening_requirements: loan_requirements
      business_account_requirements: loan_requirements
      account_opening_how: loan_apply_how
    buttons:
      - {label: "Yes, contact me", payload: "lead:msme_loan"}
      - {label: "Loan requirements", payload: "loan_requirements"}
      - {label: "How to apply", payload: "loan_apply_how"}
      - {label: "Back", payload: "loans_overview"}

