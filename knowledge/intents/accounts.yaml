  - intent: account_opening_requirements
    label: "What you need to open an account"
    category: accounts
    status: draft
    phrases:
      - "what do i need to open an account"
      - "requirements to open account"
      - "documents for opening account"
      - "requirements for opening acount"
      - "what documents do i need"
      - "do i need my nrc"
      - "kyc requirements"
      - "what should i bring to open account"
      - "papers needed to open account"
      - "requirements to open a bank account"
    answer: |
      To open a personal account, visit any branch with:
      - Original valid ID (NRC, Passport, or Driving Licence)
      - Proof of residence (a utility bill)
      - TPIN certificate
      - A completed reference form — signed by a professional (lawyer,
        accountant, clergy), your employer, an existing AB Bank customer,
        or a recognized customary authority (chief, headman, court clerk,
        market association chairperson)
      Business accounts need additional entity-specific documents.
      Account opening can't be completed without full documentation.
    answer_simple: >-
      To open an account, bring: your ID (NRC, passport or driving licence), a utility bill that shows where you live, your TPIN certificate, and a reference form signed by someone who knows you.
    buttons:
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Types of accounts", payload: "account_types_overview"}
      - {label: "Business account documents", payload: "business_account_requirements"}
      - {label: "Talk to a person", payload: "human_handoff"}

