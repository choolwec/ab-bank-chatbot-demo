id: c6-digression-never-ends-a-fraud-report
turns:
  - say: someone stole money from my etumba
  - say: what is the emergency number?
    expect: {active_flow: fraud, flow_step: what_happened, strikes: 0}
  - say: how do i check my etumba balance?
    expect: {active_flow: fraud, flow_step: what_happened, text_contains: [back to your fraud report]}
  - say: they sent K500 from my wallet
    expect: {flow_step: when}
