  - intent: loan_requirements
    label: "Loan requirements"
    category: loans
    status: draft
    phrases:
      - "what do i need for a loan"
      - "loan requirements"
      - "requirments for loan"
      - "requirements for a loan"
      - "do i need collateral"
      - "documents for loan application"
      - "what do you need to give me a loan"
      - "loan qualification"
      - "who qualifies for a loan"
      - "can i get a loan without collateral"
      - "requirements for a business loan"
      - "loan documents"
      - "what are the loan requirements"
      - "how do i qualify for a loan"
      - "am i eligible for a loan"
      - "loan eligibility"
    answer: |
      For a business loan you'll typically need:
      - Age 21-65, valid & original ID (NRC, Driving Licence, or Passport)
      - A running business, 12+ months old, that a loan officer can visit
      - Proof of residence, and — if married — your spouse involved in
        the process
      - A guarantor (in business or formal employment), plus collateral
      Personal loans (government employees only) don't need collateral —
      see the personal loan details for that document list instead.
    answer_simple: >-
      For a business loan, bring your ID and proof of where you live. Your business must be at least 12 months old. You also need a guarantor and collateral.
    buttons:
      - {label: "How to apply", payload: "loan_apply_how"}
      - {label: "Personal loan details", short_label: "Personal loans", payload: "personal_loan"}
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Talk to a person", payload: "human_handoff"}

