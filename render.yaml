services:
  - type: web
    name: ab-bank-chatbot-demo
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      # P8: /admin/* is 404 until both are set. Render generates the password;
      # read it from the dashboard's Environment tab.
      - key: ADMIN_USER
        value: cc-admin
      - key: ADMIN_PASSWORD
        generateValue: true
