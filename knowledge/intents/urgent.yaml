# Priority intents (§3.1C). fraud_scam / lost_stolen_card / complaint start
# deterministic flows — the urgent keyword scan in app/guards.py also routes
# to these flows on ANY message, so these phrases are a second net, not the
# only trigger.

intents:
  - intent: fraud_scam
    label: "Report fraud or a scam"
    category: urgent
    status: draft
    flow: fraud
    flow_args: {kind: fraud}
    phrases:
      - "i have been scammed"
      - "i think i was scammed"
      - "scamed"
      - "fraud on my account"
      - "frawd"
      - "someone hacked my account"
      - "money missing from my account"
      - "unauthorised transaction"
      - "transaction i did not make"
      - "someone took my money"
      - "i was conned"
      - "report fraud"
      - "my money is gone"

  - intent: lost_stolen_card
    label: "Lost or stolen card"
    category: urgent
    status: draft
    flow: fraud
    flow_args: {kind: lost_card}
    phrases:
      - "i lost my card"
      - "my card was stolen"
      - "stollen card"
      - "lost my atm card"
      - "card missing"
      - "block my card"
      - "someone stole my card"
      - "i cant find my card"
      - "my card is gone"
      - "cancel my card"

  - intent: complaint
    label: "Make a complaint"
    category: urgent
    status: draft
    flow: complaint
    phrases:
      - "i want to complain"
      - "i have a complaint"
      - "make a complaint"
      - "compliant"
      - "complain about service"
      - "poor service"
      - "i am not happy with your service"
      - "your staff was rude"
      - "this is unacceptable"
      - "i want to report bad service"
      - "dispute a charge"
      - "raise a dispute"

  - intent: credential_trouble
    label: "Forgot PIN or password"
    category: urgent
    status: draft
    phrases:
      - "i forgot my pin"
      - "forgot my password"
      - "reset my pin"
      - "reset password"
      - "pin blocked"
      - "my pin is not working"
      - "locked out of my account"
      - "forgot my etumba pin"
      - "reset my etumba pin"
      - "cant log in to myabz"
      - "i forgot my internet banking password"
    answer: |
      For your security, I never handle PINs or passwords in chat — and no
      genuine member of staff will ever ask you for them.
      - eTumba PIN: [CONFIRM: reset route — {ussd_code} option, branch, or
        care line]
      - Internet banking (MyABZ): [CONFIRM: reset route]
      If you think someone else knows your PIN or password, treat it as
      urgent and call us on {emergency_phone}.
    buttons:
      - {label: "Contact details", payload: "contact_details"}
      - {label: "Find a branch", payload: "branch_locator"}
      - {label: "Talk to a person", payload: "human_handoff"}
